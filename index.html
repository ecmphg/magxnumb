        <button id="copyButton" class="action-button">Copy link</button>
        <button id="shareButton" class="action-button">Share</button>
      </div>

      <p class="footer-note">Official MAG NUMB link hub</p>

  <aside class="drawer" id="drawer" aria-hidden="true">

      <div class="drawer-head">
        <strong>MAG NUMB</strong>
        <button id="closeDrawer" aria-label="Close menu">×</button>
